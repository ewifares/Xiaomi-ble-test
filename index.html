<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xiaomi BLE GATT Test</title>
</head>

<body>

<h1>Xiaomi BLE GATT Test</h1>

<button id="connect">Connect to Scooter</button>

<p id="status">Not connected</p>

<h2>Services & Characteristics</h2>
<pre id="output">Nothing yet</pre>

<script>
const button = document.getElementById("connect");
const status = document.getElementById("status");
const output = document.getElementById("output");

button.onclick = async () => {
  try {
    status.textContent = "Searching...";
    output.textContent = "";

    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true
    });

    status.textContent =
      "Found: " + (device.name || "Unknown");

    const server = await device.gatt.connect();

    status.textContent =
      "Connected: " + (device.name || "Unknown");

    const services = await server.getPrimaryServices();

    for (const service of services) {
      output.textContent +=
        "SERVICE: " + service.uuid + "\n";

      const characteristics =
        await service.getCharacteristics();

      for (const characteristic of characteristics) {
        output.textContent +=
          "  CHARACTERISTIC: " +
          characteristic.uuid + "\n";
      }

      output.textContent += "\n";
    }

  } catch (error) {
    status.textContent = "Error: " + error.message;
  }
};
</script>

</body>
</html>
